[package]
name = "raydriver"
version = "0.0.0"
edition = "2021"
description = "Rust-native machine drivers for Rayforge, with Python bindings"
license = "MIT"
repository = "https://github.com/barebaric/raydriver"

[features]
# No defaults: embedding applications consume the pure Rust core with
# `default-features = false`. The Python build enables `python` (see
# [tool.maturin] in pyproject.toml).
default = []
python = [
    "dep:pyo3",
    "dep:pyo3-stub-gen",
    "dep:env_filter",
]

[dependencies]

async-trait = "0.1"
base64 = { version = "0.22", default-features = false, features = ["std"] }
env_filter = { version = "0.1", optional = true }
futures-util = { version = "0.3", features = ["sink"] }
if-addrs = "0.15"
log = "0.4"
mdns-sd = "0.21.7"
pyo3 = { version = "0.28", features = ["abi3", "abi3-py311", "py-clone"], optional = true }
pyo3-stub-gen = { version = "0.23.0", optional = true }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.10", default-features = false }
sha1 = { version = "0.10", default-features = false }
thiserror = "2"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "net",
    "io-util",
] }
tokio-serial = "5.4"
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
uuid = { version = "1", features = ["v4"] }

[lib]
name = "raydriver"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = ["python"]

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6.4", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-io-bluetooth = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_Bluetooth", "Win32_Foundation", "Win32_Networking_WinSock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
