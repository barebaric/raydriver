[package]
name = "raydriver"
version = "0.0.0"
edition = "2021"
description = "Rust-native machine drivers for Rayforge, with Python bindings"

[features]
default = ["python"]
python = ["dep:pyo3", "dep:pyo3-stub-gen"]

[dependencies]
async-trait = "0.1"
env_filter = "0.1"
env_logger = "0.11"
log = "0.4"
pyo3 = { version = "0.28", features = ["abi3", "abi3-py311", "py-clone"], optional = true }
pyo3-stub-gen = { version = "0.23.0", optional = true }
regex = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "net",
    "io-util",
] }
tokio-serial = "5.4"

[lib]
name = "raydriver"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = ["python"]
