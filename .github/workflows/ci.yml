name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Install wheel
        run: pip install dist/raydriver-*.whl

      - name: Lint Python
        run: pip install ruff && ruff check tests/ python/

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Lint Rust
        run: |
          set -o pipefail
          cargo fmt --check 2>&1 | tee fmt-output.txt
          cargo clippy -- -D warnings 2>&1 | tee clippy-output.txt

      - name: Persist lint output to ci-logs branch
        if: failure()
        shell: bash
        run: |
          cd "$(mktemp -d)"
          git init -q
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin ci-logs 2>/dev/null && git checkout -q -b ci-logs origin/ci-logs || git checkout -q --orphan ci-logs
          rm -rf ./* 2>/dev/null || true
          mkdir -p logs
          cp "${{ github.workspace }}/fmt-output.txt" logs/ 2>/dev/null || true
          cp "${{ github.workspace }}/clippy-output.txt" logs/ 2>/dev/null || true
          git add -A
          git commit -qm "lint diagnostics @ ${{ github.sha }}"
          git push -q origin ci-logs

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v7

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Install wheel
        shell: bash
        run: pip install dist/raydriver-*.whl

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio pytest-timeout

      - name: Run tests
        shell: bash
        run: |
          pytest -v --timeout=60 --timeout-method=thread --tb=short -rA 2>&1 | tee pytest-output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}
          path: pytest-output.txt

      - name: Persist test output to ci-logs branch
        if: failure() || cancelled()
        shell: bash
        run: |
          mkdir -p /tmp/diag
          cp pytest-output.txt /tmp/diag/${{ matrix.os }}.txt 2>/dev/null || echo "no output" > /tmp/diag/${{ matrix.os }}.txt
          cd "$(mktemp -d)"
          git init -q
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin ci-logs 2>/dev/null && git checkout -q -b ci-logs origin/ci-logs || git checkout -q --orphan ci-logs
          rm -rf ./* 2>/dev/null || true
          mkdir -p logs
          cp /tmp/diag/* logs/
          git add -A
          git commit -qm "test diagnostics: ${{ matrix.os }} @ ${{ github.sha }}"
          git push -q origin ci-logs
