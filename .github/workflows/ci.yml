name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Install wheel
        run: pip install dist/raydriver-*.whl

      - name: Lint Python
        run: pip install ruff && ruff check tests/ python/

      - name: Run pyright
        run: |
          pip install pytest pytest-asyncio
          npx --yes pyright --pythonpath $(which python) python/raydriver tests

      - name: Validate stubs in wheel
        run: |
          cat > /tmp/test_stubs.py << 'EOF'
          from raydriver.grbl import GrblSession
          from raydriver.grbl.parser import parse_state
          from raydriver.grbl.types import DeviceState

          session: GrblSession
          state: DeviceState
          parsed = parse_state("<Idle|MPos:0,0,0>", None, False)
          EOF
          npx --yes pyright --pythonpath $(which python) /tmp/test_stubs.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Lint Rust
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v7

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Install wheel
        shell: bash
        run: pip install dist/raydriver-*.whl

      - name: Install test dependencies
        shell: bash
        run: pip install pytest pytest-asyncio pytest-timeout

      - name: Run tests
        shell: bash
        run: pytest -v --timeout=60 --tb=short
