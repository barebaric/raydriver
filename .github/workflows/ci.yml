name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Install wheel
        run: pip install dist/raydriver-*.whl

      - name: Lint Python
        run: pip install ruff && ruff check tests/ python/

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Lint Rust
        run: |
          set -o pipefail
          cargo fmt --check 2>&1 | tee fmt-output.txt
          cargo clippy -- -D warnings 2>&1 | tee clippy-output.txt

      - name: Persist lint output to ci-logs branch
        if: failure()
        shell: bash
        run: |
          cd "$(mktemp -d)"
          git init -q
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin ci-logs 2>/dev/null && git checkout -q -b ci-logs origin/ci-logs || git checkout -q --orphan ci-logs
          mkdir -p logs
          cp "${{ github.workspace }}/fmt-output.txt" logs/ 2>/dev/null || true
          cp "${{ github.workspace }}/clippy-output.txt" logs/ 2>/dev/null || true
          git add -A
          git commit -qm --allow-empty "lint diagnostics @ ${{ github.sha }}"
          git push -q origin ci-logs

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Windows is covered by the sharded windows-shard job (its
        # release build is slow and one hang must not hide the rest).
        os: [ubuntu-latest, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v7

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Install wheel
        shell: bash
        run: pip install dist/raydriver-*.whl

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio pytest-timeout

      - name: Run tests
        shell: bash
        run: |
          pytest -v --timeout=60 --timeout-method=thread --tb=short -rA 2>&1 | tee pytest-output.txt
          exit ${PIPESTATUS[0]}

  windows-shard:
    name: Windows shard (${{ matrix.file }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        file:
          - tests/test_cli.py
          - tests/test_parser.py
          - tests/test_session.py
          - tests/test_streaming.py
          - tests/test_stress.py
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        shell: bash
        run: |
          set -o pipefail
          maturin build --release --out dist 2>&1 | tee build-output.txt

      - name: Persist build output to ci-logs branch
        if: failure()
        shell: bash
        run: |
          cd "$(mktemp -d)"
          git init -q
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin ci-logs 2>/dev/null && git checkout -q -b ci-logs origin/ci-logs || git checkout -q --orphan ci-logs
          mkdir -p logs/windows-shards
          cp "${{ github.workspace }}/build-output.txt" logs/windows-shards/build-output.txt 2>/dev/null || true
          git add -A
          git commit -qm --allow-empty "windows build diagnostics: ${{ matrix.file }} @ ${{ github.sha }}"
          git push -q origin ci-logs

      - name: Install wheel
        shell: bash
        run: pip install dist/raydriver-*.whl

      - name: Install test dependencies
        shell: bash
        run: pip install pytest pytest-asyncio pytest-timeout

      - name: Run shard
        shell: bash
        run: |
          python -u -m pytest ${{ matrix.file }} -v --timeout=30 --timeout-method=thread --tb=long -rA 2>&1 | tee shard-output.txt
          exit ${PIPESTATUS[0]}

      - name: Persist shard output to ci-logs branch
        if: failure() || cancelled()
        shell: bash
        run: |
          mkdir -p /tmp/diag
          cp shard-output.txt "/tmp/diag/shard-$(basename ${{ matrix.file }}).txt" 2>/dev/null || echo "no output" > "/tmp/diag/shard-$(basename ${{ matrix.file }}).txt"
          cp freeze-dump.txt "/tmp/diag/freeze-$(basename ${{ matrix.file }}).txt" 2>/dev/null || true
          cd "$(mktemp -d)"
          git init -q
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin ci-logs 2>/dev/null && git checkout -q -b ci-logs origin/ci-logs || git checkout -q --orphan ci-logs
          mkdir -p logs/windows-shards
          cp /tmp/diag/* logs/windows-shards/ 2>/dev/null || true
          git add -A
          git commit -qm --allow-empty "windows shard diagnostics: ${{ matrix.file }} @ ${{ github.sha }}"
          git push -q origin ci-logs || (git pull -q --rebase origin ci-logs && git push -q origin ci-logs)

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}
          path: pytest-output.txt

      - name: Persist test output to ci-logs branch
        if: failure() || cancelled()
        shell: bash
        run: |
          mkdir -p /tmp/diag
          cp pytest-output.txt /tmp/diag/main-${{ matrix.os }}.txt 2>/dev/null || echo "no output" > /tmp/diag/main-${{ matrix.os }}.txt
          cp freeze-dump.txt /tmp/diag/freeze-main-${{ matrix.os }}.txt 2>/dev/null || true
          cd "$(mktemp -d)"
          git init -q
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin ci-logs 2>/dev/null && git checkout -q -b ci-logs origin/ci-logs || git checkout -q --orphan ci-logs
          mkdir -p logs
          cp /tmp/diag/* logs/
          git add -A
          git commit -qm --allow-empty "test diagnostics: main-${{ matrix.os }} @ ${{ github.sha }}"
          git push -q origin ci-logs || (git pull -q --rebase origin ci-logs && git push -q origin ci-logs)
